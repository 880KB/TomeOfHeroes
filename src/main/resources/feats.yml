feats:
  feats:
    - id: ALERTNESS
      name: Alertness
      type: GENERAL
      repeatType: SINGLE
      shortDescription: "+2 bonus on Listen and Spot checks"
      prerequisites: []

    - id: COMBAT_EXPERTISE
      name: Combat Expertise
      type: FIGHTER
      repeatType: SINGLE
      shortDescription: "Trade attack bonus for AC (max 5 points)"
      prerequisites:
        - type: ATTRIBUTE
          attribute: INTELLIGENCE
          min: 13

    - id: IMPROVED_DISARM
      name: Improved Disarm
      type: FIGHTER
      repeatType: SINGLE
      shortDescription: "+4 bonus on disarm attempts; no attack of opportunity"
      prerequisites:
        - type: ATTRIBUTE
          attribute: INTELLIGENCE
          min: 13
        - type: FEAT
          feat: COMBAT_EXPERTISE

    - id: TOUGHNESS
      name: Toughness
      type: GENERAL
      repeatType: STACKS
      shortDescription: "+3 hit points"
      prerequisites: []

