      repeatType: SINGLE
      shortDescription: "Angriffsbonus gegen RK eintauschen (max. 5 Punkte)"
      description: >
        Du kannst einen Teil deines Angriffs zur Verteidigung nutzen. Zu
        Beginn deines Zuges legst du einen Wert von mindestens 1 fest, um den
        sich dein Angriffsbonus verringert (höchstens dein Grundangriffsbonus,
        maximal 5); um denselben Wert erhöht sich deine Rüstungsklasse bis zu
        deinem nächsten Zug.
      prerequisites:
        - type: ATTRIBUTE
          attribute: INTELLIGENCE
          min: 13
      benefits: []

