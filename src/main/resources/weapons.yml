# Waffenkatalog aus dem (korrekten D&D-3.5-)Spielerhandbuch, Kapitel 7 "Ausrüstung",
# Tabelle 7-5: Waffen, Quelle: doc/datenquellen/Waffen.pdf.
#
# Bewusst nicht mit übertragen (siehe ARBEITSPLAN.md, Punkt 3a):
# - Munition (Pfeile, Armbrustbolzen, Schleuderkugeln) - keine eigene Waffe, sondern Verbrauchsgut
#   ohne eigenen Schaden/Kritisch-Wert.
# - Netz - richtet keinen regulären Schaden an (reine Fesselwirkung), passt nicht ins aktuelle
#   Schadensmodell.
# - Schilde und Rüstungsstacheln (Leichter/Schwerer Schild, Leichter/Schwerer Stachelschild,
#   Rüstungsstacheln) - eigener Ausrüstungsslot (RK-Bonus), keine Waffe im Sinne dieses Katalogs.
# - Preis: aktuell kein Anwendungsfall (keine Kauf-/Wirtschaftslogik), daher kein Feld im Modell.
#
# Gewicht ist der Mittelgroß-Basiswert (Tabellen-Fußnote 1: halbiert für kleine, verdoppelt für
# große Waffen) - noch nicht als Rechenfunktion umgesetzt, nur als Rohdaten hinterlegt.
